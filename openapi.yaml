    ServiceStatus:
      type: string
      description: |
        `draft` is not discoverable and not invocable. `published` is both.
        `disabled` stops new invocations without removing the service from
        anyone's transaction history.
      enum: [draft, published, disabled]

    # The error envelope, shared by every failure response in the document.
    # Nesting the code and message under `error` leaves room to add sibling
    # fields such as `invocation_id` without collision.
    ServiceMethod:
      type: string
      description: |
        How Varis calls your `endpoint_url`. Agents always call Varis with
        `POST /v1/invocations`; this is the request your endpoint receives.

        `GET` sends the validated input as a query string, in sorted key order,
        with the key repeated for each array item, and no body. Numbers and
        booleans arrive as strings. Only fields declared in `input_schema` are
        sent, so its properties must be flat: strings, numbers, booleans,
        literal unions, and arrays of those. A nested input is a 400 at publish.
        Keep sensitive inputs in `POST` services, because query strings land in
        access logs.

        `POST` sends the validated input as a JSON body.
      enum: [GET, POST]
      default: GET

    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable and machine-readable. Branch on this, never on
                `message`.
              # This closed list becomes a union type in the SDK. Callers
              # switch on it exhaustively, so adding a member is a minor bump
              # and renaming one breaks every installed SDK.
              enum:
                - invalid_request
                - input_schema_violation
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - output_burnt
                - service_not_invocable
                - insufficient_funds
                - rate_limited
                - provider_error
                - schema_violation
                - timeout
                - internal_error
            message:
              type: string
              description: Human-readable. Wording may change; do not parse it.
            details:
              type: array
              description: |
                Field-level detail, where the code carries any. `path` is a
                JSON Pointer into the request body.
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
        request_id:
          $ref: "#/components/schemas/RequestId"
        invocation_id:
          type: string
          description: Present when the error is about an invocation that exists.
        replayed:
          type: boolean
          enum: [true]
          description: |
            Present when the error repeats an earlier call's recorded outcome:
            a same-key retry or a lookup.
        completed_at:
          type: string
          format: date-time
          description: Present on `output_burnt`. When the call ran.

    # The 200 for an invocation. `output` is absent only when `message` says
    # why: the call succeeded before Varis kept outputs.
    InvocationSuccess:
      type: object
      required: [request_id, invocation_id, status, completed_at]
      properties:
        request_id:
          # A $ref inside properties: reuse one definition everywhere
          # the field appears, so changing it changes all of them.
          $ref: "#/components/schemas/RequestId"
        invocation_id:
          type: string
          example: var_invk_HgD8njwg3gkTca
        status:
          type: string
          enum: [success]
        output:
          type: object
          description: The provider's response, verbatim.
          additionalProperties: true
        completed_at:
          type: string
          format: date-time
        replayed:
          type: boolean
          enum: [true]
          description: |
            Present when the response repeats an earlier call's outcome: a
            same-key retry or a lookup. `request_id` is then the original
            call's.
        message:
          type: string
          description: |
            Present instead of `output` when Varis didn't keep the output, so
            it can't be returned again. The call was charged once.

    # The 202 for a call still running. The provider fields appear once the
    # provider has accepted the call, each null until the provider sets it.
    InvocationInProgress:
      type: object
      required:
        [request_id, invocation_id, status, retry_after_seconds, instruction]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        invocation_id:
          type: string
          example: var_invk_HgD8njwg3gkTca
        status:
          type: string
          enum: [in_progress]
        replayed:
          type: boolean
          enum: [true]
          description: Present on a same-key retry or a lookup.
        progress_percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: The provider's last reported progress.
        estimated_completion_at:
          type: [string, "null"]
          format: date-time
          description: When the provider expects to finish.
        eta_in:
          type: [string, "null"]
          description: |
            The time left, in words, such as "about 12 minutes", or "past the
            provider's estimate" once that time has gone by.
        provider_message:
          type: [string, "null"]
          maxLength: 160
          description: The provider's last message about the call, in plain text.
        retry_after_seconds:
          type: integer
          minimum: 5
          maximum: 30
          description: Seconds to wait before asking again. Matches `Retry-After`.
        instruction:
          type: string
          description: How to ask again, in words an agent can follow.

    # A provider's notification, discriminated on `status`.
    Notification:
      oneOf:
        - $ref: "#/components/schemas/StartedNotification"
        - $ref: "#/components/schemas/RunningNotification"
        - $ref: "#/components/schemas/CompletedNotification"
        - $ref: "#/components/schemas/FailedNotification"
      discriminator:
        propertyName: status
        mapping:
          started: "#/components/schemas/StartedNotification"
          running: "#/components/schemas/RunningNotification"
          completed: "#/components/schemas/CompletedNotification"
          failed: "#/components/schemas/FailedNotification"

    StartedNotification:
      type: object
      required: [status]
      description: |
        The call has started and will finish later. Sent before the provider
        answers the call, it accepts the call. Sent later, it counts as
        `running`.
      properties:
        status:
          type: string
          enum: [started]
        eta_seconds:
          $ref: "#/components/schemas/EtaSeconds"
        message:
          $ref: "#/components/schemas/ProviderMessage"

    RunningNotification:
      type: object
      required: [status]
      description: The work is still running. Send one at least every 30 seconds.
      properties:
        status:
          type: string
          enum: [running]
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        eta_seconds:
          $ref: "#/components/schemas/EtaSeconds"
        message:
          $ref: "#/components/schemas/ProviderMessage"

    CompletedNotification:
      type: object
      required: [status, result]
      description: The call finished. Varis checks `result` and settles the call.
      properties:
        status:
          type: string
          enum: [completed]
        result:
          description: |
            The output, which must match the service's output schema and be
            at most 4 MB of JSON.

    FailedNotification:
      type: object
      required: [status]
      description: The call failed. Varis refunds the agent.
      properties:
        status:
          type: string
          enum: [failed]
        message:
          type: string
          description: Recorded in Varis's logs. Agents never see it.
        reason:
          type: string
          enum: [output_too_large]
          description: |
            Set when the result is larger than 4 MB of JSON, so the call fails
            with `output_too_large` instead of `provider_error`.

    EtaSeconds:
      type: integer
      minimum: 0
      maximum: 86400
      description: |
        Seconds until the provider expects to finish. Varis shows agents the
        time it works out from this.

    ProviderMessage:
      type: string
      description: |
        A plain-text message about the call, shown to agents. Varis cuts it to
        160 characters.

    # Every answer to a notification. `continue: false` means the call is over.
    NotificationAnswer:
      type: object
      required: [continue, request_id]
      properties:
        continue:
          type: boolean
          description: |
            `false` when the call is over: stop reporting on it, and don't send
            its result. Varis doesn't stop your job, or signal it in any other
            way.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - rate_limited
                - provider_error
                - schema_violation
                - timeout
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
            failure_reason:
              type: string
              description: On a `410` or `413`, why the call failed.
              enum:
                - provider_error
                - timeout
                - schema_violation
                - gateway_error
                - provider_stopped_reporting
                - deadline_exceeded
                - output_too_large
        request_id:
          $ref: "#/components/schemas/RequestId"

    # The 402 body. Everything an agent needs to recover without a human:
    # how short it is, and where to top up. The funding link is already scoped
    # to the owner, so no re-authentication is needed. Retry with the same
    # idempotency key once the balance covers the call.
    #
    # The single-value enum on `code` gives generators something to
    # discriminate on, so a caller can narrow to this shape by checking it.
    #
    # shortfall_credits is in CREDITS while prices read in cents or dollars,
    # because a shortfall can land between cents: 150 credits is 1.5 cents,
    # which no whole-cent field can express.
    InsufficientFundsError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, shortfall_credits, funding_url]
          properties:
            code:
              type: string
              enum: [insufficient_funds]
            message:
              type: string
            shortfall_credits:
              type: integer
              description: Credits needed beyond the current balance.
              example: 150
            funding_url:
              type: string
              # `format` is a hint. Most validators ignore it unless
              # configured; docs tools display it.
              format: uri
              description: Short-lived, scoped to the owner.
            granted_credits:
              type: integer
              description: |
                Present only on an owner's first paid call: Varis has added
                its one-time free credit, which covers this call. Retry
                straight away with the same idempotency key; `shortfall_credits`
                is `0`. Absent when the call costs more than the credit, which
                then goes to the owner's first top-up instead.
              example: 20000
        request_id:
          $ref: "#/components/schemas/RequestId"

    # FOUR SERVICE SHAPES, and the split is deliberate:
    #
    #   ServiceInput      what you send to create one. Most fields required.
    #   ServiceUpdate     what you send to change one. Nothing required.
    #   Service           what comes back on read.
    #   PublishedService  what comes back on publish: a Service plus `unchanged`.
    #
    # Collapsing them would mean either `id` is required on create (it is not)
    # or optional on read (it never is).
    DeviceCodeRequest:
      type: object
      required: [device_name]
      properties:
        device_name:
          type: string
          minLength: 1
          description: |
            This machine's name, usually its hostname. Shown on the approval
            page so the developer can tell their own machine from a sign-in
            they did not start, and kept on the device token to list signed-in
            machines. Surrounding whitespace is trimmed, and a name over 128
            characters is truncated rather than rejected.
          example: ada-macbook-pro

    DeviceCode:
      type: object
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
        - request_id
      properties:
        device_code:
          type: string
          description: |
            Secret. Send it to the token endpoint on every poll. Never show it
            to the developer or log it.
          example: var_dc_8fK2mQ4pL7xR3nT8wY6zB1cD5eF0gH2jK4mN9pQr
        user_code:
          type: string
          description: |
            What the developer enters on the approval page. Eight characters
            from RFC 8628's base-20 alphabet, with a dash for reading. Matching
            ignores case and punctuation.
          pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$"
          example: WDJB-MJHT
        verification_uri:
          type: string
          format: uri
          description: The approval page. Print it with the user code.
          example: https://usevaris.com/authorisation/device
        verification_uri_complete:
          type: string
          format: uri
          description: The approval page with the user code filled in. Open it in a browser when one is available.
          example: https://usevaris.com/authorisation/device?code=WDJB-MJHT
        expires_in:
          type: integer
          description: Seconds until the device code and user code stop working.
          example: 600
        interval:
          type: integer
          description: Seconds to wait between polls. Grows by 5 each time the token endpoint answers `slow_down`.
          example: 5
        request_id:
          type: string
          example: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1

    DeviceToken:
      type: object
      required: [access_token, token_type, expires_in, request_id]
      properties:
        access_token:
          type: string
          description: |
            The device token. Send it as `Authorization: Bearer` on management
            requests. Store it outside the repository; the CLI keeps it in
            `~/.config/varis/credentials.toml`.
          example: var_dt_9fK2mQ4pL7xR3nT8wY6zB1cD5eF0gH2jK4mN8pLq
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: |
            Seconds until the token expires if unused: 180 days. Every request
            that uses it pushes the expiry forward.
          example: 15552000
        request_id:
          type: string

    DeviceTokenError:
      type: object
      required: [error, error_description, request_id]
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_grant
            - invalid_request
            - server_error
          description: |
            `authorization_pending`: keep polling. `slow_down`: keep polling,
            at the new `interval`. Anything else: stop.
        error_description:
          type: string
          description: Plain language, safe to print to the developer.
        interval:
          type: integer
          description: Seconds to wait before the next poll. Present on `authorization_pending` and `slow_down`.
        request_id:
          type: string

    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: Every key that may sign a request. Match on `kid`.
          items:
            $ref: "#/components/schemas/SigningKey"

    SigningKey:
      type: object
      required: [kid, alg, use, public_key_pem]
      properties:
        kid:
          type: string
          description: The key ID. A signed request names it in `X-Varis-Key-Id`.
          example: k1
        alg:
          type: string
          enum: [Ed25519]
          description: The signature algorithm.
        use:
          type: string
          enum: [sig]
          description: What the key is for. Always `sig`, for verifying signatures.
        public_key_pem:
          type: string
          description: The public key, as an SPKI PEM.
          example: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAUveyTfJ/zen7AvAKxSG3Q0HZ+GGw6aLk5/pOI097FQE=
            -----END PUBLIC KEY-----

    OwnerMembership:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          description: Send this as `X-Varis-Owner-Identifier`, and store it in `varis.json` as `owner_id`.
          example: var_ownr_A7xK9mQ2pL4tRs
        name:
          type: string
          example: World Bank
        role:
          type: string
          enum: [admin, member]
          description: Your role in this owner.

    ServiceInput:
      type: object
      required:
        - slug
        - name
        - description
        - service_type
        - categories
        - endpoint_url
        - input_schema
        - output_schema
      properties:
        slug:
          type: string
          description: |
            Unique within your ownership, and permanent. Republishing the same
            slug updates that service; a new slug creates a second one.
          # A regex constraint. Generators emit it as runtime validation.
          # This one allows lowercase words joined by single hyphens.
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 64
          example: weather-with-rainfall
        name:
          type: string
          maxLength: 128
          example: Weather with rainfall
        description:
          type: string
          description: |
            Required, and the highest-leverage field you write. An agent reads
            it to decide whether to call you, and it is half the search index.
            Name the capability and its inputs in plain words.
          minLength: 20
          maxLength: 1024
          example: Returns current temperature, humidity, and rainfall in millimetres for any city.
        instructions:
          type: string
          description: |
            Optional. How an agent should use the service, when the input
            fields alone don't say: another service to call first, or where a
            value comes from. Agents read it with the description before
            calling. Publishing is declarative, so omitting it, or sending an
            empty string, removes any instructions already stored.
          maxLength: 2000
          example: Call search-organisations first, and pass the organisation's id as organisation_id.
        service_type:
          $ref: "#/components/schemas/ServiceType"
        categories:
          type: array
          description: |
            Category slugs, at least one. A service with no categories is
            undiscoverable, so an empty list is an error rather than "all".

            Unlike service_type, these are a closed list the platform defines.
            An unknown slug is a 400.
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
          example: [weather, science]
        endpoint_url:
          type: string
          format: uri
          description: |
            Must be HTTPS and publicly reachable. Varis signs every request to
            it with Ed25519. Verify with the public key at
            `/.well-known/varis-signing-keys`.

            A localhost address is rejected at publish time rather than failing
            silently on every invocation.

            No query string or fragment. For a `GET` service, the input becomes
            the query string, so declare query values as `input_schema`
            properties instead.
          example: https://api.example.com/v1/weather
        method:
          allOf:
            - $ref: "#/components/schemas/ServiceMethod"
          description: |
            Defaults to `GET`. Publishing is declarative, so omitting it on a
            republish sets `GET` even if the service was `POST`.
          default: GET
        price_cents:
          type: integer
          minimum: 0
          description: |
            Your price per request, in US cents. An integer, as with every
            financial API. Defaults to 0, which makes the service free. Agents
            pay this plus the 5% Varis fee, and you receive all of it.

            Varis settles internally in credits at 100 credits per cent, which
            is why the fee on a one cent call still reconciles exactly.
          default: 0
          example: 3
        version:
          type: string
          description: |
            Recorded, not resolved. Invocations always hit the current
            definition; there is no version selection in this release. The
            field exists so published definitions carry one from the start.
          default: "1.0.0"
          example: "1.0.0"
        status:
          allOf:
            - $ref: "#/components/schemas/ServiceStatus"
          description: Defaults to `published`. Send `draft` to register without going live.
          default: published
        input_schema:
          type: object
          description: |
            JSON Schema, with a top-level `type`. Validated before the provider
            is called, so a malformed input never reaches you and never costs
            the caller anything.

            For a `GET` service, a top-level `type` of `object` whose
            properties are all flat. See `ServiceMethod`.
          # The provider defines this shape, not Varis, so anything goes.
          additionalProperties: true
        output_schema:
          type: object
          description: |
            JSON Schema, with a top-level `type`. A response that violates it
            fails the invocation and reverses the charge, so declare what you
            actually return.
          additionalProperties: true

    ServiceUpdate:
      type: object
      description: |
        Every field optional. Omitted fields are unchanged. `slug` is immutable
        and cannot appear here.
      # No `required` key at all, which is what makes this a PATCH shape.
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          minLength: 20
          maxLength: 1024
        instructions:
          type: [string, "null"]
          description: Omitted means unchanged. `null` or an empty string removes them.
          maxLength: 2000
        service_type:
          $ref: "#/components/schemas/ServiceType"
        categories:
          type: array
          description: Replaces the existing list wholesale, so a shorter list removes categories.
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        endpoint_url:
          type: string
          format: uri
          description: No query string or fragment.
        method:
          allOf:
            - $ref: "#/components/schemas/ServiceMethod"
          description: |
            Omitted means unchanged. Switching to `GET` is a 400 when the
            stored or submitted `input_schema` is not flat.
        price_cents:
          type: integer
          minimum: 0
          description: |
            Your price, in US cents. Takes effect on the next invocation.
            Agents pay this plus the 5% Varis fee.
        version:
          type: string
        status:
          $ref: "#/components/schemas/ServiceStatus"
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true

    Service:
      type: object
      # `required` on a RESPONSE schema is a promise you make to the caller:
      # these fields are always present. Generators mark everything else
      # optional, forcing callers to null-check. Promise only what you deliver.
      required:
        - id
        - slug
        - name
        - description
        - service_type
        - input_schema
        - output_schema
        - status
        - instructions
      properties:
        id:
          type: string
          description: Pass this to `/v1/invocations`, not the slug.
          example: var_serv_ydZfZ9gKKe1tQe
        slug:
          type: string
          example: weather-with-rainfall
        name:
          type: string
          example: Weather with rainfall data
        description:
          type: string
        instructions:
          type: [string, "null"]
          description: |
            How to use the service, from its provider. Read it before
            invoking: it may name another service to call first. `null` when
            the provider gave none.
        service_type:
          $ref: "#/components/schemas/ServiceType"
        provider_name:
          type: string
          description: The publishing owner's display name.
          example: National Geographic
        version:
          type: string
          example: "1.0.0"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ServiceCategory"
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/ServiceStatus"
        endpoint_url:
          type: string
          format: uri
          # Not in `required` above, precisely because it is conditional.
          # Discovery never returns it: a caller learns what a service does and
          # what it costs, never where it lives. Routing is the gateway's job.
          description: Returned only to the service's own owner.
        method:
          allOf:
            - $ref: "#/components/schemas/ServiceMethod"
          # Conditional, like endpoint_url: agents always POST /v1/invocations, so
          # how the gateway reaches the provider is none of their business.
          description: Returned only to the service's own owner.
        created_at:
          type: string
          # date-time means RFC 3339. Generators may emit `string` or `Date`
          # depending on configuration.
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListedService:
      description: |
        A service as an agent sees it: in discovery, and from
        `GET /v1/services/{service_id}` for anyone but its owner.
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          required: [price_usd]
          properties:
            price_usd:
              type: string
              # A string, not a number: the charge can land between cents,
              # and a JSON number would invite float arithmetic on money.
              pattern: "^\\d+\\.(\\d{2}|\\d{4})$"
              description: |
                What one invocation charges, in US dollars, as an exact
                decimal string: the service's price plus the Varis fee of 5%.
                The invocation is charged exactly this. Two decimals, or four
                when the charge falls between cents.
              example: "0.0315"

    OwnedService:
      description: |
        A service as its owner publishes it, with the owner's own price.
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          required: [price_cents]
          properties:
            price_cents:
              type: integer
              description: |
                Your price per invocation, in US cents. Agents pay this plus
                the 5% Varis fee; you receive all of it.
              example: 3

    PublishedService:
      description: |
        An OwnedService, plus whether this publish actually changed anything.
        The CLI prints created, updated, or unchanged from the status code and
        this flag together.
      allOf:
        - $ref: "#/components/schemas/OwnedService"
        - type: object
          required: [unchanged]
          properties:
            unchanged:
              type: boolean
              description: |
                True when the submitted definition matched what was already
                stored, in which case nothing was written and `updated_at` did
                not move. Always false on a `201`.
