# =============================================================================
# Varis API specification
#
# HOW TO READ THIS FILE
#
# An OpenAPI document has seven top-level keys:
#
#   openapi    The spec version this file conforms to. Not your API's version.
#   info       Title, version, description. Shows up in generated docs.
#   servers    Base URLs. Prepended to every path below.
#   security   The default credential for every operation. Overridable per operation.
#   tags       Grouping labels. Controls sidebar sections in generated docs.
#   paths      THE API ITSELF. Every URL, method, input, and output.
#   components Reusable definitions. Everything here exists to be referenced by paths.
#
# The mental model: `paths` is the menu. `components` is the glossary the menu
# points at, so you write each definition once.
#
# WHAT A GENERATOR DOES WITH IT
#
#   operationId          -> the SDK method name
#   components/schemas   -> TypeScript types
#   requestBody          -> the method's argument type
#   responses 2xx        -> the method's return type
#   responses 4xx/5xx    -> the error types it can throw
#
# So naming here is not cosmetic. `operationId: invoke` becomes
# `client.invoke()`, and renaming it later breaks every installed SDK.
#
# THE SPEC DESCRIBES; THE HANDLER ENFORCES. `default`, `minimum`, `minItems`
# and `pattern` below document what the server does. They do not make it do it.
# A constraint here that the handler does not apply is worse than no
# constraint, because the SDK trusts this file.
# =============================================================================

# Which version of the OpenAPI specification this document follows. 3.1 aligns
# with JSON Schema, which matters here because services declare their own JSON
# Schemas and 3.0 would have mangled them.
openapi: 3.1.0

# -----------------------------------------------------------------------------
# info: metadata. Pure documentation, no behaviour. Safe to edit freely.
# -----------------------------------------------------------------------------
info:
  title: Varis API
  # Your API's version, unrelated to the `openapi:` key above. Bump the minor
  # when you add a field, the major when you break one.
  version: 0.2.0
  license:
    name: Proprietary
    url: https://usevaris.com/terms
  # Markdown. Becomes the landing page of generated docs.
  description: |
    Varis lets autonomous agents discover, pay for, and invoke software
    capabilities published by independent developers.

    Two credential types reach this API:

    - An **agent key** (`var_ak_`) invokes services and spends credits against
      its owner's balance.
    - A **device token** (`var_dt_`) identifies a developer signed in with
      `varis login`. Sent with `X-Varis-Owner-Identifier`, it publishes and
      updates that owner's services. It never invokes and never spends.

    Sending the wrong credential type is a `403`, not a `401`. The credential
    is valid; it is not permitted for that operation.

    A provider reports on a long-running task with a **notification token**
    (`var_nt_`) that Varis sends with that call. It works only for that call.

# -----------------------------------------------------------------------------
# servers: base URLs. Every path below is appended to these.
#
# This is where the SDK's default base URL comes from. Add a `staging` entry
# here later and the generator gives users a way to switch.
#
# Paths below start at /v1, so this resolves to https://api.usevaris.com/v1/invocations.
# Your route file lives at app/api/v1/invocations, so production needs a rewrite in
# next.config.ts stripping the /api prefix. The alternative is changing every
# path below to /api/v1, which is uglier and permanent.
# -----------------------------------------------------------------------------
servers:
  - url: https://api.usevaris.com
    description: Production

# -----------------------------------------------------------------------------
# security: the DEFAULT credential requirement for every operation.
#
# The names refer to entries in components/securitySchemes at the bottom.
# An operation that needs something different overrides this with its own
# `security:` key. An operation that needs no auth sets `security: []`.
#
# A LIST of entries means OR: any one of them works. SEVERAL SCHEMES INSIDE ONE
# entry means AND: all of them must be sent. The developer credential is the
# second case, because a device token without an owner identifier does not say
# what to act on.
# -----------------------------------------------------------------------------
security:
  - agentKey: []

# -----------------------------------------------------------------------------
# tags: grouping labels only. Each operation declares which tags it belongs to,
# and docs tools turn these into sidebar sections. Most generators also derive
# SDK namespaces from tags, so `Services` is what produces a
# `client.services.*` grouping while `operationId` supplies the method name.
# -----------------------------------------------------------------------------
tags:
  - name: Gateway
    description: Invoking services and checking on invocations.
  - name: Provider notifications
    description: |
      How a provider reports on a call that takes longer than 30 seconds.
      The SDK sends these for you.
  - name: Services
    description: Publishing, updating, and finding services.
  - name: CLI
    description: |
      Signing in the `varis` CLI. The device authorisation flow from RFC 8628:
      the CLI starts a sign-in, the developer approves it in the dashboard, and
      the CLI collects a device token.
  - name: Request signing
    description: |
      The public keys that verify requests Varis sends to your endpoint.

# =============================================================================
# paths: the API itself.
#
# Structure is always three levels:
#
#   paths:
#     /the/url:           <- the path, appended to the server URL
#       post:             <- the HTTP method
#         operationId:    <- the SDK method name
#         ...             <- everything about that one operation
#
# One path can hold several methods. /v1/services has both `get` (search) and
# `post` (publish), because they share a URL but do different things.
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # The gateway. The only endpoints that move money.
  #
  # Starting a call and checking on it share one path. Every outcome below is
  # written once, in components/responses, because the same call can be
  # answered three ways: the first request, a same-key retry, and a lookup.
  # ---------------------------------------------------------------------------
  /v1/invocations:
    post:
      # Becomes client.invoke() in the generated SDK. Must be unique across the
      # whole document. This is the single most consequential string in the file.
      # It moved here from /v1/invoke, so client.invoke() calls the new path.
      operationId: invoke
      # One line, shown in docs listings and IDE autocomplete.
      summary: Invoke a service
      # The long version. Markdown. This is where behaviour that the schema
      # cannot express goes.
      description: |
        Validates the input against the service's declared input schema, calls
        the provider, and validates the response against the declared output
        schema. A response that violates the output schema is a failure: the
        provider has not delivered.

        A provider has 30 seconds to give its first answer. A provider can
        answer that it has started instead, and finish later. The call then
        returns `202` with `status: "in_progress"`. Retry with the same
        `Idempotency-Key`, or call `GET /v1/invocations/{invocation_id}`,
        after `Retry-After` seconds. An accepted call fails if the provider
        reports nothing for 300 seconds, and every call fails 24 hours after
        it starts.

        A retry with the same `Idempotency-Key`, service, and input never runs
        the call again or charges again. It returns the call's recorded
        outcome, with the original `request_id` and `"replayed": true`. A key
        stays reserved while its call runs and for 48 hours after it ends.

        Varis keeps a successful output, encrypted, for one hour after it's
        first returned, or 24 hours after the call ends if it's never
        returned. After that, a same-key retry or a lookup returns `410`
        with `output_burnt`.

        Requires an agent key. A developer API key is rejected with `403`.
      tags: [Gateway]
      # Overrides the top-level default. Here it happens to match, but stating
      # it explicitly means changing the global default later cannot silently
      # change this operation.
      security:
        - agentKey: []
      # Inputs that are NOT the body: headers, query strings, path segments.
      # A $ref because the same header appears on /v1/invoke.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      # The request body. Generators turn this into the method's argument type.
      requestBody:
        $ref: "#/components/requestBodies/Invoke"
      # Every status code this operation can return, each with its body shape.
      #
      # Status codes are quoted because YAML would otherwise read 200 as a
      # number and the spec requires string keys.
      #
      # This block is what makes the generated SDK's error handling typed. An
      # undocumented status code becomes an untyped surprise for callers.
      responses:
        "200":
          # Required on every response. Docs show it beside the status code.
          description: |
            The provider returned output matching its declared schema. On a
            same-key retry, `replayed` is `true` and `request_id` is the
            original call's.
          # Response headers worth documenting. Most are not.
          headers:
            X-Varis-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Varis-Invocation-Id:
              $ref: "#/components/headers/InvocationId"
            Idempotency-Key:
              $ref: "#/components/headers/IdempotencyKey"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationSuccess"
              # `examples` (plural) holds several named cases. `example`
              # (singular) holds one. Note the extra `value:` nesting the
              # plural form requires; forgetting it is the usual mistake.
              examples:
                success:
                  summary: A call that succeeded
                  value:
                    invocation_id: var_invk_HgD8njwg3gkTca
                    status: success
                    output:
                      rate: 0.92
                      converted: 92
                    completed_at: "2026-11-01T10:15:04.212Z"
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                replayed:
                  summary: A same-key retry of a call that succeeded
                  value:
                    invocation_id: var_invk_HgD8njwg3gkTca
                    status: success
                    replayed: true
                    output:
                      rate: 0.92
                      converted: 92
                    completed_at: "2026-11-01T10:15:04.212Z"
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "202":
          $ref: "#/components/responses/InvocationInProgress"
        "400":
          description: |
            The request is malformed, or `input` violates the service's
            declared input schema. No invocation row is written and the
            provider is never called.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                inputSchemaViolation:
                  value:
                    error:
                      code: input_schema_violation
                      message: The input does not match the service's input schema.
                      details:
                        - path: /message
                          message: must be string
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "401":
          # The entire response is a $ref, not just its schema. Use this when
          # the description and body are identical across operations.
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientFunds"
        "403":
          description: |
            The credential is valid but not permitted. Sending a developer API
            key here, or an agent whose limits or category scope exclude this
            service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such service, or the service is not published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/InvokeConflict"
        "410":
          $ref: "#/components/responses/OutputBurnt"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InvocationInternalError"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "504":
          $ref: "#/components/responses/ProviderTimedOut"

  # ---------------------------------------------------------------------------
  # One invocation, looked up by its ID. Answers exactly as a same-key retry
  # of POST /v1/invocations would, so the two can never disagree.
  # ---------------------------------------------------------------------------
  /v1/invocations/{invocation_id}:
    parameters:
      - $ref: "#/components/parameters/InvocationId"
    get:
      operationId: getInvocation
      summary: Get an invocation
      description: |
        Returns the outcome of an earlier call, without running it again or
        charging: its progress while it runs, its output once it succeeds,
        or its error if it failed. The answer is the one a same-key retry of
        `POST /v1/invocations` gets, so `replayed` is always `true` and
        `request_id` is the original call's.

        Any agent of the same owner can look up the call. Another owner's
        call is a `404`.

        A lookup counts as a read of the output, and shares the agent's limit
        of 120 requests a minute with `POST /v1/invocations`.
      tags: [Gateway]
      security:
        - agentKey: []
      responses:
        "200":
          description: The call succeeded.
          headers:
            X-Varis-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Varis-Invocation-Id:
              $ref: "#/components/headers/InvocationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationSuccess"
              examples:
                success:
                  summary: A call that succeeded
                  value:
                    invocation_id: var_invk_HgD8njwg3gkTca
                    status: success
                    replayed: true
                    output:
                      rate: 0.92
                      converted: 92
                    completed_at: "2026-11-01T10:15:04.212Z"
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                outputNotKept:
                  summary: A call that succeeded before Varis kept outputs
                  value:
                    invocation_id: var_invk_HgD8njwg3gkTca
                    status: success
                    replayed: true
                    message: >-
                      This call succeeded and was charged once. Its output
                      wasn't cached, so it can't be returned again. Consider
                      invoking the service again.
                    completed_at: "2026-10-12T10:15:04.212Z"
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "202":
          $ref: "#/components/responses/InvocationInProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is valid but isn't an agent key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invocation, or it belongs to another owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: No such invocation.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "410":
          $ref: "#/components/responses/OutputBurnt"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InvocationInternalError"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "504":
          $ref: "#/components/responses/ProviderTimedOut"

  # ---------------------------------------------------------------------------
  # Provider-facing. A provider reports on a call it accepted. The SDK sends
  # these; a provider without the SDK sends the same JSON by hand.
  # ---------------------------------------------------------------------------
  /v1/invocations/{invocation_id}/notifications:
    parameters:
      - $ref: "#/components/parameters/InvocationId"
    post:
      operationId: sendInvocationNotification
      summary: Report on a call
      description: |
        Tells Varis how a call is going, from the provider's side: `started`,
        `running`, `completed` with a result, or `failed`. Authenticate with
        the notification token Varis sent with the call, in the
        `X-Varis-Notification-Token` header. It works only for that call.

        A provider accepts a call in one of two ways: it answers the call
        with `202` and `{"status":"started"}`, or it sends a `started`
        notification before it answers. After a `started` notification, a
        `2xx` answer, or no answer within 30 seconds, leaves the call
        running, and a non-`2xx` answer fails it.

        Once accepted, the call fails if Varis receives no notification for
        300 seconds. Send `running` at least every 30 seconds while the work
        runs. Every call fails 24 hours after it starts.

        Every answer carries `continue`. `false` means the call is over:
        stop reporting on it and don't send its result. Varis doesn't stop
        your job, or signal it in any other way. Whether to stop the work is
        up to you.

        Varis accepts up to 120 notifications a minute for one call.
      tags: [Provider notifications]
      security:
        - notificationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notification"
            examples:
              started:
                summary: The call has started
                value:
                  status: started
                  eta_seconds: 600
                  message: Queued for rendering
              running:
                summary: The work is still running
                value:
                  status: running
                  progress_percent: 40
                  eta_seconds: 360
                  message: Rendering frame 400 of 1000
              completed:
                summary: The call finished with a result
                value:
                  status: completed
                  result:
                    video_url: https://cdn.example.com/renders/8f1a0c2e.mp4
              failed:
                summary: The call failed
                value:
                  status: failed
      responses:
        "200":
          description: |
            Varis recorded the notification. `continue` is `true` after
            `started` or `running`, and `false` after `completed` or
            `failed`, or when the call already succeeded.
          headers:
            X-Varis-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              examples:
                running:
                  summary: Keep reporting
                  value:
                    continue: true
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                ended:
                  summary: The call is over
                  value:
                    continue: false
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "400":
          description: |
            The body isn't one of the four shapes. `continue` is `true`: the
            call goes on, so fix the body and send it again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              example:
                continue: true
                error:
                  code: invalid_request
                  message: The notification body is invalid.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "401":
          description: |
            The notification token is missing, invalid, expired, or belongs
            to another call. `continue` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              example:
                continue: false
                error:
                  code: unauthorized
                  message: The notification token is missing, invalid, or expired.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "410":
          description: |
            The call has already failed, for example after 300 seconds
            without a notification, or past its 24-hour limit.
            `error.failure_reason` says why, and `error.code` is the code the
            agent got. `continue` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              example:
                continue: false
                error:
                  code: provider_error
                  message: This invocation has already ended.
                  failure_reason: provider_stopped_reporting
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "413":
          description: |
            The `completed` result is larger than 4 MB of JSON. The call
            fails with `output_too_large`, and the agent isn't charged.
            Return a large result as a URL to your own storage instead.
            `continue` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              example:
                continue: false
                error:
                  code: provider_error
                  message: >-
                    result is larger than 4 MB of JSON. Return a large result
                    as a URL to your own storage instead.
                  failure_reason: output_too_large
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "422":
          description: |
            The `completed` result doesn't match the service's output schema.
            The call fails with `schema_violation`, and the agent isn't
            charged. `continue` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              example:
                continue: false
                error:
                  code: schema_violation
                  message: result does not match the service's output schema.
                  details:
                    - path: /video_url
                      message: must be string
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "429":
          description: |
            More than 120 notifications a minute for this call. `continue` is
            `true`: wait for the number of seconds in `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
        "500":
          description: |
            Varis couldn't record the notification. `continue` is `true`:
            send it again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswer"
              example:
                continue: true
                error:
                  code: internal_error
                  message: Something went wrong. Retry the notification.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1

  # ---------------------------------------------------------------------------
  # DEPRECATED. POST /v1/invocations replaces it, with the same request and
  # the same responses. Kept running for integrations that already call it.
  # Every response it sends carries Deprecation and Link headers (RFC 9745).
  # ---------------------------------------------------------------------------
  /v1/invoke:
    post:
      operationId: invokeDeprecated
      summary: Invoke a service (deprecated)
      deprecated: true
      description: |
        Use `POST /v1/invocations` instead. This endpoint takes the same
        request and returns the same responses, and keeps working for
        integrations that already call it.

        Every response also carries two headers:

        - `Deprecation: @1793491200`: deprecated since 1 November 2026.
        - `Link: <https://api.usevaris.com/v1/invocations>; rel="successor-version"`.
      tags: [Gateway]
      security:
        - agentKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Invoke"
      responses:
        "200":
          description: The provider returned output matching its declared schema.
          headers:
            X-Varis-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Varis-Invocation-Id:
              $ref: "#/components/headers/InvocationId"
            Idempotency-Key:
              $ref: "#/components/headers/IdempotencyKey"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/SuccessorLink"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationSuccess"
        "202":
          $ref: "#/components/responses/InvocationInProgress"
        "400":
          description: |
            The request is malformed, or `input` violates the service's
            declared input schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientFunds"
        "403":
          description: |
            The credential is valid but not permitted, or the agent's limits
            or category scope exclude this service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such service, or the service is not published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/InvokeConflict"
        "410":
          $ref: "#/components/responses/OutputBurnt"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InvocationInternalError"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "504":
          $ref: "#/components/responses/ProviderTimedOut"

  # ---------------------------------------------------------------------------
  # One path, two methods. GET searches, POST publishes. They share a URL
  # because they act on the same collection.
  # ---------------------------------------------------------------------------
  /v1/services:
    get:
      operationId: searchServices
      summary: Search published services
      description: |
        Returns published services only. Accepts either credential type.

        Different parameters are ANDed. Repeated `category` values are ORed.
        So `?q=weather&category=climate&category=science` means "matches weather,
        AND is in climate or science".
      tags: [Services]
      # Two entries means OR: an agent key works, or a signed-in developer
      # does. The developer entry lists two schemes in one map, which is an
      # AND: the bearer token says who, the owner identifier says for whom.
      security:
        - agentKey: []
        - deviceToken: []
          developerOwner: []
      # Query-string parameters. `in: query` puts them after the ?; `in: header`
      # makes them headers; `in: path` fills a {placeholder} in the URL.
      parameters:
        - name: q
          in: query
          description: |
            Full-text search over name and description, with name weighted
            higher.

            Pass two to four capability words, not a sentence. Unquoted terms
            are ANDed, so every word must appear in the same service. "weather
            rainfall" works; "find me a weather service with rainfall data"
            matches nothing.

            Words are stemmed, so "rainfalls" finds "rainfall". Partial words
            are not: "weath" matches nothing.

            Supported syntax: `OR` between terms, `"quoted phrases"` for
            adjacent words, and `-excluded` to remove a term.
          schema:
            type: string
          example: weather rainfall
        - name: category
          in: query
          description: Filter by category slug. Repeat for several; they are ORed.
          schema:
            # An array in a query string. The default serialisation repeats the
            # key: ?category=a&category=b
            type: array
            items:
              $ref: "#/components/schemas/ServiceCategory"
        - name: max_price_cents
          in: query
          description: |
            Exclude services that charge more than this per invocation, in US
            cents. Compared against the charge, the price plus the Varis fee,
            so a 3 cent service is excluded by `3` and included by `4`.
          schema:
            type: integer
            # Constraints. Generators emit them as runtime validation and docs
            # tools display them.
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            # Documents the server's behaviour when the caller omits it. It
            # does NOT make the server apply it; your handler still must.
            default: 20
        - name: cursor
          in: query
          description: |
            The `next_cursor` from a previous page. Every other filter must be
            repeated alongside it, because the cursor carries position only.

            Prefer following `next_url`, which already carries them.
          schema:
            type: string
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema:
                type: object
                # All three are always present. next_cursor and next_url are
                # null on the last page rather than absent, so a caller can
                # test one field instead of testing for existence.
                required: [data, next_cursor, next_url]
                properties:
                  data:
                    type: array
                    # Every element is a ListedService. This is where one $ref
                    # defines the shape of an entire list.
                    items:
                      $ref: "#/components/schemas/ListedService"
                  next_cursor:
                    # A 3.1 union type. In 3.0 this was `nullable: true`, which
                    # no longer exists. Generators emit `string | null`.
                    type: [string, "null"]
                    description: |
                      Opaque. Pass it back as `cursor` to get the next page.
                      Null on the last page.
                  next_url:
                    type: [string, "null"]
                    description: |
                      The next page as a complete URL, with every filter from
                      this request already applied. GET it directly rather than
                      reassembling the query. Null on the last page.
        "400":
          description: A parameter is malformed, or the cursor is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      operationId: publishService
      summary: Publish a service
      description: |
        Creates a service, or updates the existing one with the same `slug`
        under your ownership.

        The slug identifies the service permanently. Changing a slug creates a
        second service rather than renaming the first.

        Publishing is idempotent. Sending an unchanged definition returns `200`
        with `unchanged: true` and writes nothing, which is what makes
        `varis publish` safe to run on every deploy.

        Requires a signed-in developer who is a member of the owner named in
        `X-Varis-Owner-Identifier`. The published service is attributed to that
        person.
      tags: [Services]
      security:
        - deviceToken: []
          developerOwner: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        # Three outcomes across two codes. 201 means a row was inserted. 200
        # means the service already existed, and `unchanged` says whether
        # anything about it moved.
        "200":
          description: The service already existed. It was updated, or nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedService"
        "201":
          description: A new service was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedService"
        "400":
          description: |
            The service definition is invalid. A non-HTTPS or unreachable
            endpoint, a malformed JSON Schema, a negative price, a description
            under 20 characters, an unknown category slug, or no categories at
            all.

            Every problem is reported at once in `details`, so a caller fixing
            a definition does not need one round trip per field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_request
                  message: The service definition is invalid.
                  details:
                    - path: /description
                      message: must be at least 20 characters. Agents choose services by reading it.
                    - path: /endpoint_url
                      message: must use https
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            An agent key was sent, or the developer key lacks the
            `services:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # A templated path. {service_id} is filled from a path parameter.
  # ---------------------------------------------------------------------------
  /v1/services/{service_id}:
    # Parameters declared HERE, above the methods, apply to every method on
    # this path. Saves repeating the path parameter on both get and patch.
    parameters:
      - name: service_id
        in: path
        # Path parameters are always required. Omitting this is invalid.
        required: true
        schema:
          type: string
        example: var_serv_ydZfZ9gKKe1tQe

    get:
      operationId: getService
      summary: Get a service
      description: |
        Published services are readable by any credential. An agent, or any
        caller that doesn't own the service, gets it as discovery lists it,
        with `price_usd`. The service's own owner gets it as they publish it,
        with `price_cents`, `endpoint_url`, and `method`.
      tags: [Services]
      security:
        - agentKey: []
        - deviceToken: []
          developerOwner: []
      responses:
        "200":
          description: |
            The service. Its owner reads it as they publish it, with
            `price_cents`. Anyone else reads it as discovery lists it, with
            `price_usd`.
          content:
            application/json:
              schema:
                # Listed first: agents are this endpoint's usual readers, and
                # docs renderers sample the first branch.
                oneOf:
                  - $ref: "#/components/schemas/ListedService"
                  - $ref: "#/components/schemas/OwnedService"
              examples:
                listed:
                  summary: Read by an agent
                  description: |
                    Anyone but the owner. `price_usd` is the charge, the
                    3 cent price plus the 5% Varis fee.
                  value:
                    id: var_serv_ydZfZ9gKKe1tQe
                    slug: weather-with-rainfall
                    name: Weather with rainfall data
                    description: Current conditions and rainfall for a city.
                    instructions: null
                    service_type: data
                    version: "1.0.0"
                    status: published
                    categories: [climate]
                    input_schema:
                      type: object
                      properties:
                        city: { type: string }
                      required: [city]
                    output_schema:
                      type: object
                      properties:
                        temp_c: { type: number }
                        rainfall_mm: { type: number }
                    created_at: "2026-10-01T09:00:00Z"
                    updated_at: "2026-10-01T09:00:00Z"
                    provider_name: National Geographic
                    price_usd: "0.0315"
                owned:
                  summary: Read by its owner
                  description: |
                    The service as its owner publishes it, with their own
                    price in `price_cents`, `endpoint_url`, and `method`.
                  value:
                    id: var_serv_ydZfZ9gKKe1tQe
                    slug: weather-with-rainfall
                    name: Weather with rainfall data
                    description: Current conditions and rainfall for a city.
                    instructions: null
                    service_type: data
                    version: "1.0.0"
                    status: published
                    categories: [climate]
                    input_schema:
                      type: object
                      properties:
                        city: { type: string }
                      required: [city]
                    output_schema:
                      type: object
                      properties:
                        temp_c: { type: number }
                        rainfall_mm: { type: number }
                    created_at: "2026-10-01T09:00:00Z"
                    updated_at: "2026-10-01T09:00:00Z"
                    price_cents: 3
                    endpoint_url: https://api.example.com/v1/weather
                    method: GET
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such service, or it is not published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: updateService
      summary: Update your own service
      description: |
        Partial update. Omitted fields are left unchanged. Requires a signed-in
        developer who is a member of the owner named in
        `X-Varis-Owner-Identifier`, and the service must belong to that owner.

        `slug` is immutable. Publishing under a new slug creates a second
        service.
      tags: [Services]
      security:
        - deviceToken: []
          developerOwner: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # A separate schema from ServiceInput because PATCH has no
              # required fields and allows `status`, which publish also takes
              # but defaults.
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedService"
        "400":
          description: The update is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The service belongs to another owner, an agent key was sent, or the
            key lacks the `services:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# =============================================================================
# components: the glossary.
#
# NOTHING HERE IS ACTIVE ON ITS OWN. A definition only takes effect where a
# path $refs it. You can delete an unreferenced component with no effect, and
# an unused one is dead weight.
#
# The $ref syntax is a path through this document:
#   "#/components/schemas/Error"  ->  # is this file
#                                     then components, then schemas, then Error
#
# Five sub-sections are used below. Each exists because a DIFFERENT part of an
# operation is being reused:
#
#   securitySchemes  how callers authenticate
#   parameters       whole request parameters (header, query, path)
#   headers          response headers
#   responses        whole responses, description and body together
#   schemas          data shapes
# =============================================================================

  # ---------------------------------------------------------------------------
  # The CLI's sign-in. RFC 8628 field names, so OAuth tooling reads them as is.
  # ---------------------------------------------------------------------------
  /v1/cli/device/code:
    post:
      operationId: startDeviceAuthorisation
      summary: Start a CLI sign-in
      description: |
        Starts `varis login`. Returns a device code for the CLI to poll with, a
        user code for the developer to enter at `verification_uri`, and how
        often to poll.

        The device code is a secret and this is its only copy. Varis stores
        its hash. The handshake expires after `expires_in` seconds, 10 minutes,
        whether or not anyone approves it.

        Unauthenticated, because the developer has no token yet, so limited
        per IP address.
      tags: [CLI]
      # An empty list overrides the document-wide default: no credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodeRequest"
      responses:
        "200":
          description: The sign-in has started. Show the user code and poll.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        "400":
          description: The body is not JSON, or `device_name` is missing or blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: The sign-in could not be started. Retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/cli/device/token:
    post:
      operationId: exchangeDeviceCode
      summary: Collect a CLI sign-in's token
      description: |
        Poll this with the device code from `/v1/cli/device/code` every
        `interval` seconds. Until the developer decides, it answers
        `authorization_pending`. Once they approve, it returns a device token,
        exactly once.

        Answers in OAuth's own shape (RFC 6749 section 5, RFC 8628 section
        3.5), not the Varis error envelope, so any device-flow client reads
        it. Stop polling on `access_denied`, `expired_token`, or
        `invalid_grant`.

        Unauthenticated: the device code is the credential.
      tags: [CLI]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
                  example: var_dc_8fK2mQ4pL7xR3nT8wY6zB1cD5eF0gH2jK4mN9pQr
      responses:
        "200":
          description: Approved. Store the token; it is never shown again.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
        "400":
          description: Not approved yet, or never will be. See `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenError"
              examples:
                pending:
                  value:
                    error: authorization_pending
                    error_description: Waiting for you to approve the sign-in in your browser.
                    interval: 5
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                slow_down:
                  value:
                    error: slow_down
                    error_description: Polling too often. Wait the new interval before polling again.
                    interval: 10
                    request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
        "429":
          description: |
            Too many polls from this IP address, across every sign-in from it.
            The body is `slow_down`, so a device-flow client backs off and
            keeps polling. Wait at least `Retry-After` seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenError"
        "500":
          description: The poll failed on the server. Poll again after `interval`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenError"

  /v1/cli/logout:
    post:
      operationId: logout
      summary: Sign this machine out of the CLI
      description: |
        Revokes the device token that sends the request, and only that one.
        Other machines signed in as the same developer stay signed in; sign
        them out from the dashboard's Devices settings.

        Needs only the device token. Afterwards the token is rejected on
        every route, this one included, so a second call is a `401`. Treat
        that as success: the machine is signed out either way.
      tags: [CLI]
      security:
        - deviceToken: []
      responses:
        "200":
          description: This machine is signed out.
          content:
            application/json:
              schema:
                type: object
                required: [signed_out, request_id]
                properties:
                  signed_out:
                    type: boolean
                    const: true
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An agent key was sent. Only a device token can log out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me/owners:
    get:
      operationId: listMyOwners
      summary: List the owners you belong to
      description: |
        The owners the signed-in developer is a member of, with their role in
        each. `varis init` shows these as a picker and writes the chosen
        `id` into `varis.json` as `owner_id`.

        Needs only the device token. `X-Varis-Owner-Identifier` is ignored,
        because choosing an owner is what this list is for.
      tags: [CLI]
      security:
        - deviceToken: []
      responses:
        "200":
          description: Every owner you belong to, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [owners, request_id]
                properties:
                  owners:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnerMembership"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An agent key was sent. Only a device token acts for a developer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Request signing. Public. Served by
  # app/.well-known/varis-signing-keys/route.ts in varis.
  # ---------------------------------------------------------------------------
  /.well-known/varis-signing-keys:
    get:
      operationId: listSigningKeys
      summary: List signing keys
      description: |
        The public keys that verify the signature on requests Varis sends to
        your endpoint. Use the key whose `kid` matches the request's
        `X-Varis-Key-Id` header.

        Needs no credential.
      tags: [Request signing]
      security: []
      responses:
        "200":
          description: The current signing keys.
          headers:
            Cache-Control:
              description: How long to cache the keys.
              schema:
                type: string
              example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeys"

components:
  # ---------------------------------------------------------------------------
  # How callers authenticate. Referenced by name from every `security:` key.
  #
  # Both credentials are bearer tokens. An agent carries a key it was issued.
  # A developer carries the device token from `varis login`, plus the owner
  # `varis init` wrote into varis.json: the token proves who they are, the
  # owner says which workspace they are acting for, and the server checks the
  # membership joining the two.
  #
  # OpenAPI cannot express "bearer token starting with var_ak_", so the two
  # schemes look identical to a generator and the distinction lives in the
  # descriptions and in your handler. The server tells them apart by the token
  # itself: an agent key starts var_ak_, a device token var_dt_.
  # ---------------------------------------------------------------------------
  securitySchemes:
    agentKey:
      # `http` + `bearer` means the Authorization: Bearer <token> header.
      # Other options include apiKey (custom header or query) and oauth2,
      # which weekend 7 adds for the MCP server.
      type: http
      scheme: bearer
      description: An agent key, prefixed `var_ak_`. Invokes and spends.
    deviceToken:
      type: http
      scheme: bearer
      description: |
        A device token, prefixed `var_dt_`, issued by `varis login` to one
        machine and stored there. Identifies the human; carries no permissions
        of its own. Expires 180 days after its last use, and can be revoked
        from the dashboard.
    developerOwner:
      type: apiKey
      in: header
      name: X-Varis-Owner-Identifier
      description: |
        The owner the developer is acting for, from varis.json. Only accepted
        when the device token's user is a member of it.
    notificationToken:
      type: http
      scheme: bearer
      description: |
        A notification token, prefixed `var_nt_`. Varis sends one with each
        call to a provider, in the `X-Varis-Notification-Token` header. It
        reports on that one call only, and expires an hour after the call
        ends. The SDK sends it for you; never log it.

  # ---------------------------------------------------------------------------
  # Reusable REQUEST parameters. Referenced from an operation's `parameters:`.
  # ---------------------------------------------------------------------------
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Scoped to the agent. Reusing a key with the same service and input
        returns the recorded outcome of the first call and does not invoke
        the provider again. Reusing a key with a different service or input
        is a `409`. A key stays reserved while its call runs and for 48 hours
        after the call ends; after that, it starts a new call.
      schema:
        type: string
        maxLength: 255
      example: 8f1a0c2e-3b4d-4f5a-9c6e-7d8f9a0b1c2d
    InvocationId:
      name: invocation_id
      in: path
      required: true
      description: The `invocation_id` from the response that started the call.
      schema:
        type: string
      example: var_invk_HgD8njwg3gkTca

  # ---------------------------------------------------------------------------
  # Reusable RESPONSE headers. A different section from `parameters` above
  # because these travel outbound, not inbound.
  # ---------------------------------------------------------------------------
  headers:
    RequestId:
      description: Present on every response, including errors. Quote it in support requests.
      schema:
        type: string
    InvocationId:
      description: |
        The call this response is about. Present on every response that names
        an invocation.
      schema:
        type: string
    IdempotencyKey:
      description: |
        The `Idempotency-Key` the request sent, on every response that names
        an invocation. Retry with it.
      schema:
        type: string
    RetryAfter:
      description: |
        Seconds to wait before asking again: between 5 and 30, from the
        provider's estimate, or 30 without one.
      schema:
        type: integer
        minimum: 5
        maximum: 30
    Deprecation:
      description: |
        `@1793491200`: the endpoint was deprecated on 1 November 2026
        (RFC 9745).
      schema:
        type: string
    SuccessorLink:
      description: |
        `<https://api.usevaris.com/v1/invocations>; rel="successor-version"`:
        the endpoint that replaces this one.
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Reusable request bodies. POST /v1/invocations and its deprecated alias take
  # the same one.
  # ---------------------------------------------------------------------------
  requestBodies:
    Invoke:
      required: true
      content:
        # The media type. Everything under it describes a JSON body.
        application/json:
          schema:
            type: object
            # Fields the caller MUST send. Everything else is optional.
            # Generators mark non-required fields as optional in TypeScript.
            required: [service_id]
            properties:
              service_id:
                type: string
                description: The service to invoke.
                # Shows up in docs and in the "try it" playground.
                example: var_serv_ydZfZ9gKKe1tQe
              input:
                type: object
                description: |
                  Passed to the provider unchanged. Must validate against the
                  service's `input_schema`. A malformed input fails the
                  invocation without calling the provider and without
                  creating a transaction. Leave it out for a service that
                  takes no input: a missing input is treated as `{}`, and
                  still has to pass the schema, so a service with required
                  fields rejects it.
                # Allows arbitrary keys. Without this, a strict validator
                # rejects anything not listed under `properties`, and here
                # the shape is defined by the service, not by Varis.
                additionalProperties: true

  # ---------------------------------------------------------------------------
  # Whole reusable responses: description, headers, and body together.
  #
  # Use these when the same response appears identically across operations.
  # A 401 is the same everywhere; a 404 is not, because its description
  # differs per resource, which is why 404 is written out each time above.
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: The credential is missing, malformed, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # The outcomes of one invocation. POST /v1/invocations, its deprecated
    # alias, and GET /v1/invocations/{invocation_id} all answer with these, so
    # a retry and a lookup can never disagree.
    InvocationInProgress:
      description: |
        The call is still running. Retry with the same `Idempotency-Key`, or
        call `GET /v1/invocations/{invocation_id}`, after `Retry-After`
        seconds. Once the provider has accepted the call, the body also
        carries what the provider last reported.
      headers:
        X-Varis-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Varis-Invocation-Id:
          $ref: "#/components/headers/InvocationId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvocationInProgress"
          example:
            invocation_id: var_invk_HgD8njwg3gkTca
            status: in_progress
            progress_percent: 40
            estimated_completion_at: "2026-11-01T10:27:00.000Z"
            eta_in: about 12 minutes
            provider_message: Rendering frame 400 of 1000
            retry_after_seconds: 30
            instruction: >-
              This call is still running. Retry POST /v1/invocations with the
              same service_id, input, and Idempotency-Key, or call GET
              /v1/invocations/var_invk_HgD8njwg3gkTca, after
              retry_after_seconds. Once returned, the output can be fetched
              again for one hour.
            request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
    InsufficientFunds:
      description: |
        The owner's balance cannot cover this call. The response carries
        the shortfall and a short-lived funding link already scoped to the
        owner, so no re-authentication is needed. Retry with the same
        idempotency key once the balance is topped up.

        On an owner's first paid call, the response also carries
        `granted_credits`: Varis added a one-time $2 credit that covers
        the call, so retry straight away.
      content:
        application/json:
          schema:
            # Spelled out as its own schema rather than an allOf extension
            # of Error. allOf merges TOP-LEVEL schemas, not nested objects:
            # two branches each describing `error` produce a schema where
            # neither branch evaluates the other's properties, and every
            # field reads as unevaluated.
            $ref: "#/components/schemas/InsufficientFundsError"
          examples:
            short:
              summary: The balance is short
              value:
                error:
                  code: insufficient_funds
                  message: The balance does not cover this call.
                  shortfall_credits: 150
                  funding_url: https://usevaris.com/fund/t/abc123
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
            first_paid_call:
              summary: A first paid call, with the free credit added
              value:
                error:
                  code: insufficient_funds
                  message: >-
                    The available balance is too low for this request. As
                    this is your first paid invocation, we've added a $2.00
                    credit to your balance. Retry this invocation with the
                    same idempotency key to complete the request. When the
                    task is done, ask the account owner to top up using the
                    funding_url below. It expires in 30 minutes.
                  shortfall_credits: 0
                  funding_url: https://usevaris.com/fund/t/abc123
                  granted_credits: 20000
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
    InvokeConflict:
      description: |
        `conflict`: the idempotency key was already used for a different
        service or a different input. Returning the other call's outcome
        would hide a caller bug, so this is an error rather than a replay.

        `service_not_invocable`: the service is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            conflict:
              value:
                error:
                  code: conflict
                  message: This idempotency key was already used for a different service or input.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
            serviceNotInvocable:
              value:
                error:
                  code: service_not_invocable
                  message: This service is not published and cannot be invoked.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
    OutputBurnt:
      description: |
        The call succeeded, and its output has been deleted. Varis keeps an
        output for one hour after it's first returned, or 24 hours after the
        call ends if it's never returned. `completed_at` says when the call
        ran. To run it again, use a new idempotency key; that call is charged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: output_burnt
              message: >-
                This call completed at 2026-11-01T10:15:04.212Z. Its output has
                been deleted: Varis keeps an output for an hour after it's
                first returned, or 24 hours if it's never read. To run the call
                again, use a new idempotency key. You'll be charged again.
            request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
            invocation_id: var_invk_HgD8njwg3gkTca
            replayed: true
            completed_at: "2026-11-01T10:15:04.212Z"
    InvocationInternalError:
      description: |
        Something went wrong on Varis's side. If the message says you weren't
        charged, Varis failed before it called the provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: >-
                Something went wrong on Varis's side before the provider was
                called. You weren't charged.
            request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
            invocation_id: var_invk_JQiIMAapCjpS4t
    ProviderFailed:
      description: |
        The provider failed, and the agent isn't charged. `provider_error`:
        it returned a non-2xx status, an output larger than 4 MB of JSON, or
        stopped reporting on a call it accepted for 300 seconds.
        `schema_violation`: it returned output that violates its own declared
        schema. The provider's raw response is never forwarded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            providerError:
              value:
                error:
                  code: provider_error
                  message: The provider failed to handle the request.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                invocation_id: var_invk_JQiIMAapCjpS4t
            stoppedReporting:
              value:
                error:
                  code: provider_error
                  message: >-
                    The provider stopped responding while running this call.
                    You weren't charged. The provider has been told to stop
                    the job.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                invocation_id: var_invk_JQiIMAapCjpS4t
            outputTooLarge:
              value:
                error:
                  code: provider_error
                  message: >-
                    The provider returned an output larger than Varis can
                    deliver. You weren't charged.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                invocation_id: var_invk_JQiIMAapCjpS4t
            schemaViolation:
              value:
                error:
                  code: schema_violation
                  message: The provider returned output that does not match its schema.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                invocation_id: var_invk_JQiIMAapCjpS4t
    ProviderTimedOut:
      description: |
        The provider didn't give its first answer within 30 seconds, or a
        call it accepted didn't finish within 24 hours. The agent isn't
        charged. A provider that timed out on its first answer may still have
        finished the work.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            firstAnswer:
              value:
                error:
                  code: timeout
                  message: The provider did not respond in time.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                invocation_id: var_invk_JQiIMAapCjpS4t
            deadline:
              value:
                error:
                  code: timeout
                  message: >-
                    The provider didn't finish within 24 hours. You weren't
                    charged. The provider has been told to stop the job.
                request_id: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1
                invocation_id: var_invk_JQiIMAapCjpS4t

  # ---------------------------------------------------------------------------
  # schemas: data shapes. The section that becomes your TypeScript types.
  #
  # Each top-level key here becomes an exported type with that name, so
  # `Service` becomes `interface Service`. Renaming one is a breaking change
  # for anyone importing the type.
  # ---------------------------------------------------------------------------
  schemas:
    # A named scalar. Worth extracting because the field appears in four
    # places and the description should only be written once.
    RequestId:
      type: string
      description: Unique to this request. Present on every response.
      example: var_req_fc8e8702-6a7f-4f3f-9147-748936e5fee1

    # Extracted so the same closed list drives ServiceInput, ServiceUpdate and
    # Service. Mirrors the services_type_valid check constraint: adding a value
    # is safe, renaming one is not.
    ServiceType:
      type: string
      description: |
        What shape of thing this is, as opposed to what domain it is about.
        Categories answer the domain question. A market data feed is
        service_type `data` with categories finance, media, and politics.
      enum:
        - data
        - content
        - tool
        - skill
        - compute
        - memory
        - storage
        - model
        - messaging
      example: data

    # Closed list the platform defines. Mirrors the categories seed table and
    # the ServiceCategory union in the TypeScript SDK: adding a value is safe,
    # renaming or removing one is not.
    ServiceCategory:
      type: string
      description: |
        What domain a service is about. Complements service_type, which says
        what shape of thing it is.
